# Settings overlay for the pipeline's `omp -p` runs only (daily.py passes --config <this file>).
# Your global ~/.omp/agent/config.yml is untouched, so interactive omp keeps its own models.
modelRoles:
  default: muskapi2/gpt-6.1-terra                      # orchestrator
  task: openrouter/deepseek/deepseek-v4.1-flash        # qualify/apply workpool subagents (drive the ATS forms)

retry:
  enabled: true
  maxRetries: 5                      # attempts after the first failure
  baseDelayMs: 2000                  # exponential: 2 s, 4 s, 8 s, 16 s, 30 s (capped)
  maxDelayMs: 30000
  modelFallback: true
  fallbackOn: any
  fallbackChains:                    # orchestrator only; the task model deliberately has no backup
    default: [anthropic/claude-sonnet-5-5]
