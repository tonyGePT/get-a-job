# Settings overlay for the pipeline's `omp -p` runs only (daily.py passes --config <this file>).
# Your global ~/.omp/agent/config.yml is untouched, so interactive omp keeps its own models.
modelRoles:
  default: muskapi2/gpt-6.1-terra
  task: muskapi2/gpt-6-luna          # qualify/apply workpool subagents

retry:
  enabled: true
  maxRetries: 3                      # attempts after the first failure
  baseDelayMs: 2000                  # exponential: 2 s, 4 s, 8 s ...
  maxDelayMs: 30000                  # ... never waiting more than 30 s
  modelFallback: true
  fallbackOn: any
  fallbackChains:
    default: [openrouter/deepseek/deepseek-v4.1-flash]
    task: [openrouter/deepseek/deepseek-v4.1-flash]
